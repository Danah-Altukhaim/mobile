version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: masari-postgres
    environment:
      POSTGRES_DB: masari
      POSTGRES_USER: masari
      POSTGRES_PASSWORD: masari_dev
    ports:
      - '5432:5432'
    volumes:
      - masari_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masari']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: masari-redis
    ports:
      - '6379:6379'
    volumes:
      - masari_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  masari_pgdata:
  masari_redis:
